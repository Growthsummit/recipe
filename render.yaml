# Render Blueprint for the RecipeBox backend API.
#
# In Render: New -> Blueprint -> connect this repository. Render reads this file
# and provisions the web service below. Variables marked `sync: false` are left
# blank on purpose and must be filled in the Render dashboard (they are secrets).
services:
  - type: web
    name: recipebox-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Turso (already-provisioned online database)
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # Auth - the secret is generated by Render on first deploy
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: BCRYPT_ROUNDS
        value: "10"
      # Comma-separated list of allowed frontend origins (the Vercel URL)
      - key: CORS_ORIGIN
        sync: false
      # Used to build password-reset links
      - key: FRONTEND_URL
        sync: false
      # Password-reset email (Resend)
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Blockchain (Sepolia) - optional, leave blank to disable
      - key: BLOCKCHAIN_NETWORK
        value: sepolia
      - key: BLOCKCHAIN_CHAIN_ID
        value: "11155111"
      - key: BLOCKCHAIN_RPC_URL
        sync: false
      - key: BLOCKCHAIN_CONTRACT_ADDRESS
        sync: false
