# Render Blueprint for the RecipeBox backend API and the Recipe AI inference service.
#
# In Render: New -> Blueprint -> connect this repository. Render reads this file
# and provisions the web services below. Variables marked `sync: false` are left
# blank on purpose and must be filled in the Render dashboard (they are secrets).
services:
  - type: web
    name: recipebox-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Turso (already-provisioned online database)
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # Auth - the secret is generated by Render on first deploy
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: BCRYPT_ROUNDS
        value: "10"
      # Comma-separated list of allowed frontend origins (the Vercel URL)
      - key: CORS_ORIGIN
        sync: false
      # Used to build password-reset links
      - key: FRONTEND_URL
        sync: false
      # Password-reset email (Resend)
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Recipe AI - the Python inference service defined further down in this file.
      # `property: host` would inject the private-network hostname, which a free
      # web service cannot receive traffic on, so reference its public URL instead.
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: recipebox-ai
          envVarKey: RENDER_EXTERNAL_URL
      - key: AI_SERVICE_TOKEN
        fromService:
          type: web
          name: recipebox-ai
          envVarKey: AI_SERVICE_TOKEN
      - key: AI_SERVICE_TIMEOUT_MS
        value: "15000"
      # Blockchain (Sepolia) - optional, leave blank to disable
      - key: BLOCKCHAIN_NETWORK
        value: sepolia
      - key: BLOCKCHAIN_CHAIN_ID
        value: "11155111"
      - key: BLOCKCHAIN_RPC_URL
        sync: false
      - key: BLOCKCHAIN_CONTRACT_ADDRESS
        sync: false

  # Inference-only Python service behind the "Recipe AI" screens. It loads the
  # Joblib artifacts committed under ai/models/ and never trains during a request.
  - type: web
    name: recipebox-ai
    runtime: python
    plan: free
    rootDir: ai
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # The pinned scikit-learn/scipy/pandas range does not have wheels for the
      # Python 3.14 default Render now uses for new services.
      - key: PYTHON_VERSION
        value: "3.12.6"
      # Shared bearer token; the backend copies this same value via fromService.
      - key: AI_SERVICE_TOKEN
        generateValue: true
